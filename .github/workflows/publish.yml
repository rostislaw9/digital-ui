# Publish ionbit-ui (CLI) to npm on GitHub Release.
#
# Uses npm Trusted Publisher (OIDC) — no long-lived NPM_TOKEN secret required.
# Before this workflow can publish, configure the Trusted Publisher on npm:
#   https://www.npmjs.com/package/ionbit-ui/access → Trusted Publisher
#
# Form values:
#   Organization or user:  rostislaw9
#   Repository:            ionbit-ui
#   Workflow filename:     publish.yml
#   Environment name:      npm
#   Allowed actions:       publish
#
# The git tag (e.g. v0.1.2) is the source of truth for the version. The
# workflow syncs all version references in the repo to match the tag, commits
# the sync to main, builds the CLI, and publishes with provenance attestation.

name: Publish

on:
  release:
    types: [published]

# Prevent concurrent publishes racing on the same version.
concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: write # push the version-sync commit to main
  id-token: write # request an OIDC token for npm Trusted Publisher

jobs:
  publish:
    name: Publish ionbit-ui to npm
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Extract version from tag
        id: version
        run: |
          tag="${{ github.event.release.tag_name }}"
          # Strip leading "v" (e.g. v0.1.2 → 0.1.2)
          version="${tag#v}"
          if ! echo "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[\w.]+)?$'; then
            echo "::error::Tag \"$tag\" is not a valid semver (expected v0.1.2 form)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing version $version"

      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          # A token with write access is needed to push the version-sync commit.
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # npm Trusted Publisher (OIDC) requires npm >= 11.5.1.
      # Node 24 ships with npm 11.x, but we upgrade explicitly to be safe.
      - name: Upgrade npm for OIDC support
        run: |
          npm install -g npm@latest
          npm --version

      - name: Verify OIDC token availability
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL}" ]; then
            echo "::error::OIDC token NOT available — check workflow has id-token: write permission"
            exit 1
          fi
          echo "OIDC token available"

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Sync version references to ${{ steps.version.outputs.version }}
        run: node tooling/sync-versions.mjs ${{ steps.version.outputs.version }}

      - name: Commit version sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit — versions already in sync."
          else
            git commit -m "chore: sync version to ${{ steps.version.outputs.version }}

            Auto-synced by the Publish workflow on Release ${{ github.event.release.tag_name }}."
            git push origin main
          fi

      - name: Build CLI
        run: yarn workspace ionbit-ui run build

      - name: Verify CLI dist version matches tag
        run: |
          # The built dist/index.js must report the tag version.
          reported=$(node packages/cli/dist/index.js --version)
          echo "CLI reports: $reported"
          if [ "$reported" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::CLI version ($reported) does not match tag (${{ steps.version.outputs.version }})"
            exit 1
          fi

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        working-directory: packages/cli
